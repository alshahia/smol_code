# Continuous integration for smolcode.
#
# Every job in this file, and what it actually gates (verified 2026-10-24,
# decision 0044). Keep this list in sync with the jobs below; a job that is
# missing from this header is a documentation bug.
#
#   lint             ruff check + ruff format --check on src/            (ubuntu, windows)
#   tests            pytest suite, docker-marked tests deselected        (ubuntu, windows)
#   sandbox-contract shellcheck + iptables script contract + firewall e2e
#   coverage         pytest --cov-fail-under=80 -- BLOCKING gate. The 80%
#                    baseline was verified locally on 2026-08-26; an earlier
#                    header called this gate non-blocking, which was stale.
#   web              pnpm install --frozen-lockfile + oxlint + tsc -b + vite
#                    build + vitest + Playwright (chromium on PRs, full
#                    chromium/firefox/webkit matrix on main)
#   tier-images      all three tier images build on a real Docker daemon +
#                    tier contract / network posture tests
#   packaging        wheel builds, installs into a throwaway venv, ships the
#                    tier Dockerfiles, console script works without a provider
#                    key, `images ensure` exits 6 instead of tracebacking
#   audit            pip-audit + pnpm audit -- ADVISORY only: both steps set
#                    continue-on-error, findings are triaged, they do not block
#   docs-guard       fails on stale references in current-state docs (0044 §8)
#
# Phase history: Phase 0 (2026-08-26 plan) added lint / tests /
# sandbox-contract / coverage; Phase 3 (decision 0038, 2026-09-24 review
# R2/R5/R6) added web / tier-images / packaging / audit; Phase 9
# (decision 0044) added docs-guard and re-verified the header above.
#
# The suite defaults to SMOLCODE_EXECUTOR=local (tests/conftest.py), so every
# job here runs without a Docker daemon except tier-images and sandbox-contract.

name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: smolcode

jobs:
  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Ruff lint (src)
        run: uv run ruff check src
      - name: Ruff format check (src)
        run: uv run ruff format --check src

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Unit suite (docker-marked tests deselected)
        # shellcheck-marked tests self-skip when the binary is absent
        # (windows); ubuntu runners ship shellcheck so they run there.
        # No Docker daemon is required: conftest defaults the suite to the
        # local executor (decision 0038, review R5).
        run: uv run pytest src/smolcode/tests -m "not docker" -q

  sandbox-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Ensure shellcheck present
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fi
          shellcheck --version | head -2
      - name: iptables script contract + firewall end-to-end tests
        # These tests build smolcode:elevated-test themselves and skip
        # cleanly only when Docker is unavailable; on ubuntu-latest it is.
        run: uv run pytest src/smolcode/tests/test_elevated_iptables.py -m "docker or shellcheck" -v

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Baseline verified locally 2026-08-26: full suite exits 0 under
    # --cov-fail-under=80 (1227 passed / 5 skipped), so 80 blocks
    # regressions. This gate is BLOCKING (an earlier header called it
    # non-blocking, which was stale).
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Suite with coverage
        run: >
          uv run pytest src/smolcode/tests -m "not docker" -q
          --cov=smolcode --cov-report=term-missing --cov-fail-under=80

  web:
    name: web (install, lint, typecheck, build, unit, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: smolcode/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: smolcode/web/pnpm-lock.yaml
      - name: Install (frozen lockfile)
        # Fails if pnpm-workspace.yaml (allowBuilds: esbuild) is missing or
        # the lockfile drifts from package.json -- the review found a fresh
        # clone could not install at all (ERR_PNPM_IGNORED_BUILDS).
        run: pnpm install --frozen-lockfile
      - name: Lint (oxlint)
        run: pnpm lint
      - name: Typecheck (tsc -b, strict)
        # Standalone so a future change to `build` cannot mask type errors;
        # `strict: true` landed with decision 0038.
        run: pnpm typecheck
      - name: Production build
        run: pnpm build
      - name: Unit tests (vitest)
        run: pnpm test
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: E2E (chromium on PRs, full matrix on main)
        # The e2e suite mocks the backend API; it is a frontend smoke layer,
        # not an integration test against the FastAPI server (see Phase 5/7).
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm test:e2e --project=chromium
          else
            pnpm test:e2e
          fi

  tier-images:
    name: tier images (docker build of all three tiers)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Docker daemon reachable
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            echo "::error::docker CLI missing on runner"
            exit 1
          fi
          docker version
      - name: Tier image contract tests
        # test_tier_images_docker.py builds each tier and checks the
        # source-hash label, command allowlist, and the internal-network
        # egress posture; test_network_posture.py asserts the bridge
        # topology. Both self-skip only when the daemon is unreachable.
        run: >
          uv run pytest -m docker
          src/smolcode/tests/test_tier_images_docker.py
          src/smolcode/tests/test_network_posture.py -v
      - name: All three tier images build
        # The contract tests above skip per-tier when a build fails (host
        # egress constraints), so this explicit gate is what makes a broken
        # full_access.Dockerfile red. R6: CI previously never built it.
        run: |
          uv run python -m smolcode.images ensure --tier restricted
          uv run python -m smolcode.images ensure --tier elevated
          uv run python -m smolcode.images ensure --tier full_access

  packaging:
    name: packaging (wheel installs in a clean venv)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: uv build --wheel --out-dir dist
      - name: Install wheel into a throwaway venv
        run: |
          uv venv /tmp/smolcode-wheel
          uv pip install --python /tmp/smolcode-wheel/bin/python dist/*.whl
      - name: Tier build context ships in the wheel
        # R1: this failed with "build input missing: .../docker/restricted.
        # Dockerfile" for every pip-installed smolcode until package-data
        # was declared. This step is the regression guard.
        run: |
          /tmp/smolcode-wheel/bin/python -m smolcode.images hash restricted
          /tmp/smolcode-wheel/bin/python -m smolcode.images hash elevated
          /tmp/smolcode-wheel/bin/python -m smolcode.images hash full_access
      - name: CLI runs from the wheel with no provider key
        # The console script, not `python -m smolcode.cli`: the module has no
        # __main__ guard, so running it as a module prints argparse help and
        # exits 2 regardless of the arguments.
        run: /tmp/smolcode-wheel/bin/smolcode --print-config
      - name: images ensure exits 6 (not a traceback) with no daemon
        # The module CLI used to print a raw DockerException traceback when
        # the daemon was down; decision 0038 routes it through ImageBuildError.
        # ubuntu-latest HAS a working daemon, so point DOCKER_HOST at a socket
        # that cannot exist: the assertion is about the error path, not about
        # what the runner happens to provide.
        env:
          DOCKER_HOST: unix:///var/run/smolcode-intentionally-absent.sock
        run: |
          set +e
          /tmp/smolcode-wheel/bin/python -m smolcode.images ensure --tier restricted
          rc=$?
          set -e
          if [ "$rc" -ne 6 ]; then
            echo "::error::expected exit 6 from images ensure, got $rc"
            exit 1
          fi

  audit:
    name: audit (pip-audit, pnpm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          # No dependency install happens in this job, so pnpm's store dir is
          # never populated; enabling the cache here made the action's post
          # step fail ("path ... does not exist") and fail the whole job even
          # though both audits are continue-on-error.
          node-version: "24"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: pip-audit (locked python dependencies)
        # Advisory gate: report findings, do not block the build. Triage in
        # Phase 9 (patch / pinned exception / accept with expiry).
        continue-on-error: true
        run: |
          uv export --frozen --no-emit-project --no-hashes -o /tmp/req.txt
          uv run --with pip-audit pip-audit -r /tmp/req.txt
      - name: pnpm audit (high severity or worse)
        continue-on-error: true
        working-directory: smolcode/web
        run: pnpm audit --audit-level=high

  docs-guard:
    name: docs guard (stale references, decision 0044 §8)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The guard reads files across the whole repo, so it must NOT inherit the
    # repo-wide `working-directory: smolcode` default set above.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - name: Current-state docs carry no stale references
        # Textual guard, deliberately narrow: a document cannot be executed,
        # so this only catches regressions of facts that were fixed in
        # decision 0044. Scope is an explicit list of CURRENT-STATE files.
        #
        # Excluded by design (frozen history, not laziness):
        #   docs/reviews/2026-*/, docs/decisions/0003-003*, TASKS.md,
        #   .gitignore, git history. Those are records of what was true at a
        #   past date; rewriting them to satisfy a grep would destroy the
        #   audit trail (ADR 0044 §2). smolcode/docs/litellm-proxy.md is still
        #   on the stale-path list (finding A6) but is out of Phase 9 scope,
        #   so it is not scanned here either.
        run: |
          set -u
          fail=0
          # Split so this file does not match its own scan.
          pat="smol_clone_""2"
          files="
            smolcode/README.md
            smolcode/.env.example
            smolcode/web/README.md
            .github/workflows/ci.yml
            docs/environment.md
            docs/security.md
            docs/architecture.md
            docs/roadmap.md
            docs/operations.md
          "
          for f in $files; do
            if [ ! -f "$f" ]; then
              echo "::error::docs-guard: expected current-state file is missing: $f"
              fail=1
              continue
            fi
            if grep -nH "$pat" "$f"; then
              echo "::error::docs-guard: stale pre-rename path found in $f"
              fail=1
            fi
          done
          if grep -nH "This template provides a minimal setup" smolcode/web/README.md; then
            echo "::error::docs-guard: stock Vite template text is back in smolcode/web/README.md"
            fail=1
          fi
          if grep -nH "SHIPPED on 2026-08-25" smolcode/README.md; then
            echo "::error::docs-guard: stale 2026-08-25 status block is back in smolcode/README.md"
            fail=1
          fi
          exit "$fail"
