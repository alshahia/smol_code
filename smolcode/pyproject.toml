[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smolcode"
version = "0.1.0"
description = "Local/Docker multi-agent coding assistant built on smolagents."
requires-python = ">=3.10"
dependencies = [
    # smolagents >=1.27 is on main (1.27.0.dev0) but never released on
    # PyPI. 1.26.0 is the last published tag and contains every API
    # smolcode uses (decision 0026). Pin <1.27 so a future 1.27
    # release forces an explicit bump.
    "smolagents[litellm,docker,mcp]>=1.26.0,<1.27",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.1.0",
    "pytest-datadir",
    "pytest-timeout",
    "pytest-cov>=5.0.0",
]

web = [
    # M8 GUI viewer (decision 0010 D2). Optional install via
    # `uv pip install -e ".[web]"`. Not required for CLI use.
    # FastAPI >=0.137 has a route-registration regression in this app:
    # APIRouter(prefix='/api').include_router() silently drops routes
    # under FastAPI 0.137+. Pin to <0.137 (last known-good release).
    # Decision 0026 reproduced this on 0.137.0 / 0.138.0 / 0.139.x and
    # verified 0.115.x / 0.116.x / 0.136.x register routes correctly.
    "fastapi>=0.115,<0.137",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
]

[project.scripts]
smolcode = "smolcode.cli:main"

[tool.uv]
dev-dependencies = [
    "ruff>=0.9.0",
    "pytest>=8.1.0",
    "pytest-datadir",
    "pytest-timeout",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Coverage is enforced by the Makefile `test` target and the CI coverage
# job, NOT here: a global --cov-fail-under makes every subset/partial run
# exit non-zero and trains contributors to ignore red exits.
addopts = "-sv --durations=0 --basetemp=.pytest_tmp"
testpaths = ["src/smolcode/tests"]
# M16: markers for tests that need optional tools.
# `docker`   -- requires a working Docker daemon (used by contract tests
#               that build + run the elevated sandbox image)
# `shellcheck` -- requires `shellcheck` binary on PATH (used to lint
#               docker/iptables-init.sh)
markers = [
    "docker: tests that require a Docker daemon (deselected if Docker unavailable)",
    "shellcheck: tests that require the shellcheck binary on PATH",
]

[tool.ruff]
line-length = 119
lint.ignore = ["F403", "E501"]
lint.select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"src/smolcode/tests/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["smolcode"]
lines-after-imports = 2
